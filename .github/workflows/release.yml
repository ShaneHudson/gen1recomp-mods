name: Release

# Publishes each mod as its own GitHub Release on its per-mod mirror repo
# (shanehudson-gen1recomp-mods/<id>) -- the repo the mod's manifest
# `github` field points at. One version stream per mod, no lockstep: the
# released version is whatever the mod's manifest says, and a mod whose
# version is already on its mirror is skipped, so releasing "all" is safe.
#
# The real work happens in scripts/release.sh, the same script used for
# local releases; this workflow just provides a runner with the game repo
# checked out for modkit validation.
#
# Releases are MANUAL ONLY: run from the Actions tab (or `gh workflow run
# Release`) after testing. Pushes never publish.
#
# Needs the MIRROR_RELEASE_TOKEN secret: a fine-grained PAT with
# Contents read/write on the org's repos. The default GITHUB_TOKEN can
# only write to this repo, not the mirrors.

on:
  workflow_dispatch:
    inputs:
      mods:
        description: "Space-separated mod ids. Blank = all mods (already-released versions are skipped)."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout gen1recomp (for modkit)
        uses: actions/checkout@v4
        with:
          repository: bryanthaboi/gen1recomp
          path: .gen1recomp

      - name: Install luajit
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.MIRROR_RELEASE_TOKEN }}
          GEN1RECOMP_DIR: ${{ github.workspace }}/.gen1recomp
          MODS: ${{ github.event.inputs.mods }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::MIRROR_RELEASE_TOKEN secret is not set (needs a fine-grained PAT with Contents read/write on the org's repos)."
            exit 1
          fi
          scripts/release.sh $MODS
